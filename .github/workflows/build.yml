name: build deb

on:
  push:
    branches:
      - main
    paths:
      - '*.h'
      - '*.m'
      - '*.mm'
      - '*.x'
      - '*.xm'
      - '*.c'
      - '*.cc'
      - '*.cpp'
      - '*.s'
      - '*.S'
      - 'Sources/**/*.h'
      - 'Sources/**/*.m'
      - 'Sources/**/*.mm'
      - 'Sources/**/*.x'
      - 'Sources/**/*.xm'
      - 'Sources/**/*.c'
      - 'Sources/**/*.cc'
      - 'Sources/**/*.cpp'
      - 'Sources/**/*.s'
      - 'Sources/**/*.S'
      - 'DYYY.plist'
      - 'control'
      - 'Makefile'
      - 'Makefile.sources'
      - 'Makefile.jailed'
      - 'layout/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.relevance.outputs.should_build }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "验证原项目发布自动化：保持 release notes 合约不变"
        run: .github/scripts/test-release-notes.sh

      - name: "检测本次源码/打包修改：决定是否重新构建"
        id: relevance
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] ||
             .github/scripts/build-relevance.sh range "$PUSH_BEFORE" "$GITHUB_SHA"; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Build-relevant plugin, package, or Makefile changes detected."
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Only non-build Makefile settings changed; skipping Deb build."
          fi

  build:
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: "校验本次兼容性修复：禁止 CoreFoundation inline hook"
        shell: bash
        run: |
          set -euo pipefail
          source_file="Sources/Features/DYYYHighFPSHooks.m"
          if grep -En 'MSHookFunction|DYYYInstallCFBundleProMotionHookIfNeeded|DYYYCFBundleGetValueForInfoDictionaryKey' "$source_file"; then
            echo "The CoreFoundation inline hook must remain disabled for the iOS 27 Impactor build." >&2
            exit 1
          fi
          grep -Eq 'method_setImplementation' "$source_file"
          test -f DYYYABTestHook.xm

      - name: "检查原项目依赖缓存：解析 Theos 与 SDK 提交"
        run: |
          echo upstream_heads=`git ls-remote https://github.com/roothide/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1` >> $GITHUB_ENV

      - name: "复用原项目 Theos 缓存：避免改变构建环境"
        id: cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: "清理无关 Homebrew taps：不修改 DYYY 源码"
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
          HOMEBREW_NO_AUTOREMOVE: "1"
        run: |
          if brew list --formula | grep -Fxq "bicep"; then
            brew uninstall --formula --ignore-dependencies bicep
          fi
          for tap in aws/tap azure/bicep; do
            if brew tap | grep -Fxq "$tap"; then
              brew untap "$tap"
            fi
          done

      - name: "准备原项目 Theos：编译当前兼容性修复"
        uses: huami1314/theos-action@main

      - name: "准备 GNU Make：保持原项目 Makefile 行为"
        run: |
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: "清理并重建 packages：保持原项目产物目录"
        run: rm -rf packages && mkdir -p packages

      - name: "编译本次修改后的 DYYY：rootful .deb"
        run: |
          make package SCHEME=rootful FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          for f in packages/*.deb; do
            [ -f "$f" ] && [[ "$f" != *"-root"*".deb" ]] && mv "$f" "${f%.deb}-rootful.deb"
          done

      - name: "编译本次修改后的 DYYY：rootless .deb"
        run: |
          make package SCHEME=rootless FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          for f in packages/*.deb; do
            [ -f "$f" ] && [[ "$f" != *"-root"*".deb" ]] && mv "$f" "${f%.deb}-rootless.deb"
          done

      - name: "编译本次修改后的 DYYY：roothide .deb"
        run: |
          make package SCHEME=roothide FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          for f in packages/*.deb; do
            [ -f "$f" ] && [[ "$f" != *"-root"*".deb" ]] && mv "$f" "${f%.deb}-roothide.deb"
          done

      - name: "编译本次新增的 DYYY：Jailed Impactor arm64 dylib"
        run: |
          set -euo pipefail
          # Theos versions differ on whether they honor THEOS_BUILD_DIR. Clear
          # both possible object roots so this binary cannot be copied from a
          # preceding package build.
          rm -rf .theos .theos-jailed packages/jailed
          make -f Makefile.jailed jailed-dylib -j$(sysctl -n hw.ncpu)
          test -f packages/jailed/DYYY.dylib

      - name: "检查本次新增 Jailed dylib：file 与 arm64 架构"
        shell: bash
        run: |
          set -euo pipefail
          jailed="packages/jailed/DYYY.dylib"
          file "$jailed"
          lipo -info "$jailed"
          file "$jailed" | grep -Eq 'arm64'
          lipo -info "$jailed" | grep -Eq 'arm64'

      - name: "检查本次新增 Jailed dylib：otool 动态依赖与 Mach-O Load Commands"
        shell: bash
        run: |
          set -euo pipefail
          jailed="packages/jailed/DYYY.dylib"
          echo "===== otool -L $jailed ====="
          otool -L "$jailed"
          echo "===== otool -l $jailed ====="
          otool -l "$jailed"

          forbidden_jail_path='(^|[[:space:]])/var/jb|(^|[[:space:]])/Library/|\.jbroot'
          if otool -L "$jailed" | grep -Eiq "$forbidden_jail_path|mobilesubstrate|substitute|ellekit|cephei"; then
            echo 'Jailed dylib contains a forbidden jailbreak-only dynamic dependency.' >&2
            exit 1
          fi
          if otool -l "$jailed" | grep -Eiq "$forbidden_jail_path"; then
            echo 'Jailed dylib contains a forbidden jailbreak-only Mach-O path.' >&2
            exit 1
          fi

      - name: "验证本次新增 Jailed 产物：独立 dylib 不混入 Debian 包"
        shell: bash
        run: |
          set -euo pipefail
          test "$(find packages/jailed -maxdepth 1 -type f -name 'DYYY.dylib' | wc -l | tr -d ' ')" = 1
          if find packages/jailed -maxdepth 1 -type f ! -name 'DYYY.dylib' | grep -q .; then
            echo 'The Jailed artifact directory contains an unexpected dependency or package.' >&2
            exit 1
          fi

      - name: "整理本次四类独立 Artifact：固定上传文件名"
        run: |
          set -euo pipefail
          rm -rf packages/artifacts
          mkdir -p packages/artifacts/rootful packages/artifacts/rootless packages/artifacts/roothide
          cp packages/*-rootful.deb packages/artifacts/rootful/DYYY-rootful.deb
          cp packages/*-rootless.deb packages/artifacts/rootless/DYYY-rootless.deb
          cp packages/*-roothide.deb packages/artifacts/roothide/DYYY-roothide.deb

      - name: "生成本次修改产物元数据：版本号与北京时间戳"
        id: package
        run: |
          timestamp=$(TZ=Asia/Shanghai date +%Y%m%d%H%M%S)
          version=$(awk -F': ' '$1 == "Version" { print $2; exit }' control)
          if [ -z "$version" ]; then
            echo "Unable to read package version from control" >&2
            exit 1
          fi
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: "验证本次修改产物：3 个 scheme 专属 .deb"
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          deb_files=(packages/*.deb)
          if [ "${#deb_files[@]}" -ne 3 ]; then
            echo "Expected 3 Deb packages, found ${#deb_files[@]}:" >&2
            printf '  %s\n' "${deb_files[@]}" >&2
            exit 1
          fi

          for scheme in rootful rootless roothide; do
            scheme_files=(packages/*-"${scheme}".deb)
            if [ "${#scheme_files[@]}" -ne 1 ]; then
              echo "Expected exactly one ${scheme} package, found ${#scheme_files[@]}" >&2
              exit 1
            fi
          done

          printf 'Package artifact: %s\n' "${deb_files[@]}"

      - name: "提取本次兼容性修复后的 arm64 dylib"
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: .github/scripts/extract-release-dylib.sh

      - name: "整理原项目 arm64 dylib：与新增 Jailed 版本并存"
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf packages/artifacts/original-dylib
          mkdir -p packages/artifacts/original-dylib
          cp "packages/DYYY_${PACKAGE_VERSION}.dylib" \
             "packages/artifacts/original-dylib/DYYY_${PACKAGE_VERSION}.dylib"

      - name: "上传原项目标准产物：3 个 .deb 与 1 个 .dylib"
        uses: actions/upload-artifact@v7
        with:
          name: DYYY-${{ steps.package.outputs.timestamp }}
          path: |
            ${{ github.workspace }}/packages/*.deb
            ${{ github.workspace }}/packages/*.dylib

      - name: "上传原项目兼容性 Artifact：DYYY-original-dylib"
        uses: actions/upload-artifact@v7
        with:
          name: DYYY-original-dylib
          if-no-files-found: error
          path: ${{ github.workspace }}/packages/artifacts/original-dylib/*.dylib

      - name: "上传本次新增 Artifact：DYYY-rootful"
        uses: actions/upload-artifact@v7
        with:
          name: DYYY-rootful
          if-no-files-found: error
          path: ${{ github.workspace }}/packages/artifacts/rootful/DYYY-rootful.deb

      - name: "上传本次新增 Artifact：DYYY-rootless"
        uses: actions/upload-artifact@v7
        with:
          name: DYYY-rootless
          if-no-files-found: error
          path: ${{ github.workspace }}/packages/artifacts/rootless/DYYY-rootless.deb

      - name: "上传本次新增 Artifact：DYYY-roothide"
        uses: actions/upload-artifact@v7
        with:
          name: DYYY-roothide
          if-no-files-found: error
          path: ${{ github.workspace }}/packages/artifacts/roothide/DYYY-roothide.deb

      - name: "上传本次新增 Artifact：DYYY-Jailed Impactor arm64"
        uses: actions/upload-artifact@v7
        with:
          name: DYYY-Jailed
          if-no-files-found: error
          path: ${{ github.workspace }}/packages/jailed/DYYY.dylib
